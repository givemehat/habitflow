name: HabitFlow
options:
  bundleIdPrefix: com.habitflow
  createIntermediateGroups: true
targets:
  HabitFlow:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: HabitFlow
        excludes:
          - "Widgets/**"
          - "Resources/Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.habitflow.app
      SWIFT_VERSION: "6.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
    dependencies:
      - target: HabitFlowWidgets
        embed: true
  HabitFlowWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: HabitFlow/Widgets
      - path: HabitFlow/Models
        optional: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.habitflow.app.widgets
      SWIFT_VERSION: "6.0"
      INFOPLIST_FILE: HabitFlow/Widgets/Info.plist
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftData.framework
      - sdk: SwiftUI.framework
  HabitFlowTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: HabitFlow
